name: "💡 Предложение / идея"
description: "Предложить новую функцию, улучшение или идею."
body:
  - type: markdown
    attributes:
      value: |
        Опишите, что вы хотите добавить или изменить. Чем конкретнее — тем проще оценить и реализовать.

  - type: input
    id: title
    attributes:
      label: "Краткое название"
      placeholder: "Например: Тёмная тема для дашборда"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Описание *"
      description: "Что именно нужно и зачем это нужно пользователям/процессу."
      placeholder: "Хотелось бы, чтобы..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Критерии готовности (опционально)"
      description: "Как понять, что фича сделана? Например: «Кнопка переключает тему и сохраняет выбор»."
      placeholder: "Готово, когда..."

  - type: dropdown
    id: type
    attributes:
      label: "Тип"
      options:
        - "Новая функция"
        - "Улучшение существующего"
        - "Удобство (UX)"
        - "Другое"
