name: "💡 Предложение / идея"
description: "Предложить новую функцию или улучшение."
body:
  - type: markdown
    attributes:
      value: "Опишите, что вы хотите добавить или изменить."

  - type: textarea
    id: description
    attributes:
      label: "Описание"
      description: "Что именно нужно и зачем это нужно пользователям или процессу."
      placeholder: "Хотелось бы, чтобы..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Критерии готовности (опционально)"
      description: "Как понять, что фича сделана?"
      placeholder: "Готово, когда..."

  - type: dropdown
    id: type
    attributes:
      label: "Тип"
      options:
        - "Новая функция"
        - "Улучшение существующего"
        - "Удобство (UX)"
        - "Другое"
